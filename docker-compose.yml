# Deploy do portal em Docker: API + frontend + Caddy (proxy reverso com HTTPS
# automático via Let's Encrypt). Guia completo: README_DEPLOY_DOCKER.md
#
# Pré-requisitos: arquivo .env na raiz (segredos), domínio apontando para o IP
# da VPS e portas 80/443 abertas.

services:
  api:
    # O build tagueia a imagem compartilhada pelos blogs replicados
    # (/opt/blogs/* usam blog-api:<tag> sem rebuildar). Atenção: incluir
    # "image:" muda o config-hash — um `up -d` recria o container.
    image: blog-api:${BLOG_IMAGE_VERSION:-v1}
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file:
      # Terminal: lê o .env do diretório do projeto.
      # Docker Manager (UI): defina as variáveis na aba "Environment" do projeto.
      # required:false evita erro de import quando o .env não está no clone.
      - path: .env
        required: false
    environment:
      # Endpoint interno do Ollama (reescrita de IA self-hosted, grátis).
      # A api fala com o container ollama pela rede interna do compose.
      OLLAMA_BASE_URL: "http://ollama:11434"
    expose:
      - "8080"          # interno (somente o Caddy acessa)
    volumes:
      # Arquivo de conexão do assistente de instalação (/data/db-config.enc).
      # Instâncias com SUPABASE_DATABASE_URL no .env não usam este volume.
      - api_data:/data
    networks:
      default:
        # Alias ÚNICO para o Caddy: como o caddy também participa da rede
        # blogs_shared, o nome curto "api" ficou ambíguo (todo blog replicado
        # atende por "api" lá) — o Caddyfile aponta para sp011-api.
        aliases: ["sp011-api"]
    depends_on:
      - ollama
    # PRD-07: least-privilege de kernel. read_only fica de fora (Chromium/tmp
    # gravam) — validar no canário. --no-sandbox segue no código (decisão de
    # canário/operador, ver STATUS).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: blog-web:${BLOG_IMAGE_VERSION:-v1}
    build:
      context: .
      dockerfile: artifacts/brasilia-agora/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE_PATH: "/"
      API_URL: "http://api:8080"   # usado pelo prerender de OG (server-to-server)
    expose:
      - "3000"
    networks:
      default:
        aliases: ["sp011-web"]   # alias único p/ o Caddy (mesmo motivo do api)
    depends_on:
      - api
    # PRD-07: serve estático (vite preview) — bom candidato a read_only (validar no canário).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Painel Central de Notícias (coleta/reescrita/distribuição multi-blog) ──
  # Banco próprio (CENTRAL_DATABASE_URL) e segredos PRÓPRIOS (SESSION_SECRET/
  # SETTINGS_ENCRYPTION_KEY diferentes dos do blog). Instância única: os
  # schedulers rodam in-process, igual à api do blog.
  central-api:
    build:
      context: .
      dockerfile: artifacts/central-hub/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.central
        required: false
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
    expose:
      - "8090"          # interno (somente o Caddy acessa)
    volumes:
      - central_data:/data   # mp4 da Automação Social (/data/social-videos)
    depends_on:
      - ollama
    # PRD-07: least-privilege. Mantém central_data:/data gravável.
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8090/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  central-web:
    build:
      context: .
      dockerfile: artifacts/central-web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    depends_on:
      - central-api
    # PRD-07: serve estático — candidato a read_only (validar no canário).
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Postgres dos blogs replicados (um DATABASE + uma ROLE por blog) ────────
  # Sem porta no host: alcançável só pela rede blogs_shared (pg-blogs:5432).
  # Criação de banco por blog: ver deploy/README.md. Backup externo é
  # responsabilidade nossa (Fase 1 do plano de replicação).
  pg-blogs:
    image: postgres:16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      # Defina no .env da raiz: PG_BLOGS_SUPERPASS=$(openssl rand -hex 24)
      POSTGRES_PASSWORD: "${PG_BLOGS_SUPERPASS:-}"
    volumes:
      - pgblogs_data:/var/lib/postgresql/data
    networks:
      - blogs
    # PRD-07: Postgres oficial precisa gravar em /var/lib/postgresql/data e usa
    # capabilities — SÓ mem_limit + no-new-privileges + healthcheck (nada de
    # cap_drop/read_only aqui). Protege contra OOM que derrubaria os tenants.
    mem_limit: 4g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # LLM local para reescrita de artigos (grátis, roda na própria VPS via CPU).
  # Não publica porta no host — só a api acessa pela rede interna do compose.
  # Baixe o modelo uma vez após subir: docker compose exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # 30m: o modelo (~5-7 GiB) descarrega quando a reescrita fica ociosa (ex.:
      # madrugada, fora da janela BR de coleta) e recarrega em segundos no 1º
      # artigo seguinte. "-1" (para sempre) segurava a RAM 24/7 e deixava o
      # processo de longa vida acumular memória (visto 12,9 GiB p/ modelo de 5,1).
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"   # 1 geração por vez (CPU não paraleliza bem; a central também manda 1 por vez)
      # Janela de contexto do servidor. O default (2048–4096 conforme a versão)
      # truncava o prompt da reescrita (~3,4k tokens: template + fonte cortada
      # em 7k chars) ou derrubava o início do contexto durante a geração — o
      # modelo perdia a fonte e INVENTAVA a notícia inteira (incidente FGTS
      # 2026-07-17). O endpoint OpenAI-compat ignora num_ctx por chamada,
      # então o teto real é ESTE env. 16k comporta prompt + resposta (até
      # max_tokens 8192) com folga; custo ~+1 GiB de RAM no KV cache.
      OLLAMA_CONTEXT_LENGTH: "16384"
    volumes:
      - ollama_models:/root/.ollama
    # PRD-07 — PRIORIDADE anti-OOM: o Ollama já consumiu ~13 GiB (maior consumidor
    # dos 31 GiB da VPS); mem_limit dá teto sem derrubar os demais tenants. 16g dá
    # folga ao KV cache de OLLAMA_CONTEXT_LENGTH=16384. Imagem de terceiros que
    # grava modelos em /root/.ollama → sem cap_drop/read_only (validar antes).
    mem_limit: 16g
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-sp011.com.br}"
      # Host do painel central (pode ser um domínio totalmente diferente do blog)
      CENTRAL_DOMAIN: "${CENTRAL_DOMAIN:-central.${SITE_DOMAIN:-sp011.com.br}}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro   # 1 arquivo .caddy por blog replicado
      - caddy_data:/data       # certificados Let's Encrypt (persistente)
      - caddy_config:/config
      # Capas re-hospedadas da central servidas ESTÁTICAS pelo Caddy (bypass do
      # central-api) — mesmo volume que o central-api monta em /data, aqui só
      # leitura. news-images fica em /srv/central/news-images. Ver Caddyfile.
      - central_data:/srv/central:ro
    depends_on:
      - web
      - api
    networks:
      - default        # sp011 + central (api/web/central-*)
      - blogs          # blogs replicados (aliases <id>-api/<id>-web)
    # PRD-07: Caddy liga em 80/443 (<1024) — NÃO fazer cap_drop:ALL cego (perderia
    # NET_BIND_SERVICE). Só mem_limit + no-new-privileges + healthcheck (admin API).
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Rede compartilhada entre o caddy/pg-blogs e os blogs replicados. O projeto
# raiz é o dono; os compose dos blogs (/opt/blogs/*) a referenciam como
# external (name: blogs_shared).
networks:
  blogs:
    name: blogs_shared

volumes:
  caddy_data:
  caddy_config:
  ollama_models:     # modelos do Ollama (persistem entre deploys/reinícios)
  api_data:          # db-config.enc do assistente de instalação (blog instalável)
  pgblogs_data:      # dados do Postgres dos blogs replicados
  central_data:      # vídeos da Automação Social do painel central
